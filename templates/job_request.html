<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Request</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .job-request-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    .job-request-container h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    
    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .form-group {
      flex: 1;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }
    
    .file-upload {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    
    .file-upload label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #555;
    }
    
    .file-upload input {
      margin-bottom: 15px;
    }
    
    .file-upload .file-info {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    .submit-btn {
      background: #27ae60;
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: block;
      margin: 30px auto 0;
      width: 200px;
      text-align: center;
    }
    
    .submit-btn:hover {
      background: #219653;
    }
    
    .required {
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">{{ session.username[0]|upper }}</div>
    <div class="title">{{ session.username }}</div>
    <div class="menu-button" onclick="toggleMenu()">☰</div>
  </nav>

  <!-- Dropdown Menu -->
  <div class="dropdown" id="dropdownMenu">
        <a href="{{ url_for('profile') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('job_request') }}">Job Request</a>
        <a href="{{ url_for('my_job_requests') }}">My Applications</a>
        <a href="{{ url_for('admin_login') }}">Admin Login</a>
        <a href="{{ url_for('profile_management') }}">Manage Account</a>
        <a href="{{ url_for('help_center') }}">Help Center</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>

  <div class="job-request-container">
    <h2>Job Application Form</h2>
    <form id="jobRequestForm" enctype="multipart/form-data">
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name <span class="required">*</span></label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
          <label for="last_name">Last Name <span class="required">*</span></label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="mobile_no">Mobile Number <span class="required">*</span></label>
          <input type="tel" id="mobile_no" name="mobile_no" required>
        </div>
        <div class="form-group">
          <label for="email">Email ID <span class="required">*</span></label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="qualifying_degree">Qualifying Degree <span class="required">*</span></label>
          <input type="text" id="qualifying_degree" name="qualifying_degree" required>
        </div>
        <div class="form-group">
          <label for="year_of_passing">Year of Passing <span class="required">*</span></label>
          <input type="number" id="year_of_passing" name="year_of_passing" min="1900" max="2099" required>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="district">District <span class="required">*</span></label>
          <input type="text" id="district" name="district" required>
        </div>
        <div class="form-group">
          <label for="pin_code">Pin Code <span class="required">*</span></label>
          <input type="text" id="pin_code" name="pin_code" required>
        </div>
      </div>
      
      <div class="file-upload">
        <label for="photo">Upload Passport Size Photo (JPG/PNG) <span class="required">*</span></label>
        <input type="file" id="photo" name="photo" accept=".jpg,.jpeg,.png" required>
        <div class="file-info">Max size: 2MB</div>
      </div>
      
      <div class="file-upload">
        <label for="mark_sheet_10th">Upload 10th Mark Sheet (PDF) <span class="required">*</span></label>
        <input type="file" id="mark_sheet_10th" name="mark_sheet_10th" accept=".pdf" required>
        <div class="file-info">Max size: 5MB</div>
      </div>
      
      <div class="file-upload">
        <label for="mark_sheet_12th">Upload 12th Mark Sheet (PDF) <span class="required">*</span></label>
        <input type="file" id="mark_sheet_12th" name="mark_sheet_12th" accept=".pdf" required>
        <div class="file-info">Max size: 5MB</div>
      </div>
      
      <div class="file-upload">
        <label for="resume">Upload Resume (PDF) <span class="required">*</span></label>
        <input type="file" id="resume" name="resume" accept=".pdf" required>
        <div class="file-info">Max size: 5MB</div>
      </div>
      
      <div class="file-upload">
        <label for="college_mark_sheet">Upload College Mark Sheet (PDF) <span class="required">*</span></label>
        <input type="file" id="college_mark_sheet" name="college_mark_sheet" accept=".pdf" required>
        <div class="file-info">Max size: 5MB</div>
      </div>
      
      <button type="submit" class="submit-btn">Submit Application</button>
    </form>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.classList.toggle('show');
    }
    
    // Close dropdown when clicking outside
    window.onclick = function(event) {
      if (!event.target.matches('.menu-button')) {
        const dropdowns = document.getElementsByClassName("dropdown");
        for (let i = 0; i < dropdowns.length; i++) {
          const openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
    
    // Job request form handling
    document.getElementById('jobRequestForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const formData = new FormData(this);
      
      try {
        const response = await fetch('/submit_job_request', {
          method: 'POST',
          body: formData
        });
        
        if (response.ok) {
          const data = await response.json();
          alert(data.message);
          window.location.href = "{{ url_for('my_job_requests') }}";
        } else {
          const error = await response.json();
          alert('Error: ' + error.error);
        }
      } catch (error) {
        alert('Error submitting job request: ' + error.message);
      }
    });
    
    // File validation
    const fileInputs = document.querySelectorAll('input[type="file"]');
    fileInputs.forEach(input => {
      input.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
          const maxSize = this.id === 'photo' ? 2 : 5; // MB
          if (file.size > maxSize * 1024 * 1024) {
            alert(`File size must be less than ${maxSize}MB`);
            this.value = '';
          }
        }
      });
    });
  </script>
</body>
</html>
