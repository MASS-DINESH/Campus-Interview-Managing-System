<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Executive Admin Portal Login - Campus Interview Management System."/>
  <title>Admin Portal Sign In | Campus Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body style="background: var(--bg-gradient); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem;">

  <div style="width: 100%; max-width: 440px;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="/" style="text-decoration: none; display: inline-flex; align-items: center; gap: 12px;">
        <div class="brand-icon" style="width: 50px; height: 50px; font-size: 1.5rem; background: var(--grad-coral);"><i class="fas fa-user-shield"></i></div>
        <div style="font-size: 1.6rem; font-weight: 800; color: white; text-align: left;">
          Executive<span>Admin</span>
        </div>
      </a>
    </div>

    <div class="glass-card" style="background: rgba(15, 23, 42, 0.85); border-color: rgba(255, 255, 255, 0.15); color: white;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; background: rgba(239, 68, 68, 0.15); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: #ef4444; font-size: 1.8rem; border: 1px solid rgba(239, 68, 68, 0.3);">
          <i class="fas fa-lock"></i>
        </div>
        <h2 style="font-size: 1.5rem; font-weight: 800; color: white;">Admin Authentication</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem;">Restricted access portal for placement officers</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" style="color: #cbd5e1;" for="admin_username">Admin Username</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-user-shield" style="color: #64748b;"></i>
            <input type="text" id="admin_username" class="form-control" style="background: rgba(30, 41, 59, 0.7); border-color: rgba(255, 255, 255, 0.1); color: white;" placeholder="Admin Username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" style="color: #cbd5e1;" for="admin_password">Security Key / Password</label>
          <div class="input-icon-wrapper">
            <i class="fas fa-key" style="color: #64748b;"></i>
            <input type="password" id="admin_password" class="form-control" style="background: rgba(30, 41, 59, 0.7); border-color: rgba(255, 255, 255, 0.1); color: white;" placeholder="Security Key" required>
            <i class="fas fa-eye pwd-toggle" style="color: #64748b;" onclick="togglePasswordVisibility('admin_password', this)"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-danger" style="margin-top: 1.25rem; width: 100%;">
          Authorize Access <i class="fas fa-shield-check"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        <a href="/" style="color: #94a3b8; font-size: 0.9rem; text-decoration: none; transition: var(--transition);">
          <i class="fas fa-arrow-left"></i> Return to Candidate Portal
        </a>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
