<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Campus Interview Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="login_username" placeholder="Username" required><br>
      <input type="password" id="login_password" placeholder="Password" required><br>
      <button type="submit">Login</button><br><br>
      <button type="button" onclick="window.location.href='{{ url_for('register_page') }}'">Register</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
